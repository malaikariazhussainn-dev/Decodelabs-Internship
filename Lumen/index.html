<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Lumen — A cinematic form design and validation experience."
    >

    <title>Lumen — Form Validation</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="lumen-app">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="site-header">

            <a
                href="#"
                class="brand"
                aria-label="Lumen home"
            >
                LUMEN
            </a>


            <div class="header-meta">

                <span>FORM 01</span>

                <span aria-hidden="true">/</span>

                <span>IDENTITY VERIFICATION</span>

            </div>

        </header>



        <!-- =================================================
             MAIN FORM EXPERIENCE
        ================================================== -->

        <section class="form-experience">


            <!-- INTRODUCTION -->

            <div class="intro">

                <p class="eyebrow">
                    WELCOME TO LUMEN
                </p>


                <h1>
                    Create your
                    <span>identity.</span>
                </h1>


                <p class="intro-copy">
                    Enter your information carefully.
                    Lumen will verify every field before
                    your submission is accepted.
                </p>

            </div>



            <!-- =================================================
                 REGISTRATION FORM
            ================================================== -->

            <form
                id="registration-form"
                class="registration-form"
                novalidate
            >


                <!-- FULL NAME -->

                <div class="field-group">

                    <label for="full-name">
                        Full Name
                    </label>


                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required
                        aria-describedby="full-name-error"
                        aria-invalid="false"
                    >


                    <span
                        id="full-name-error"
                        class="field-error"
                        aria-live="polite"
                    ></span>

                </div>



                <!-- EMAIL -->

                <div class="field-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                        aria-describedby="email-error"
                        aria-invalid="false"
                    >


                    <span
                        id="email-error"
                        class="field-error"
                        aria-live="polite"
                    ></span>

                </div>



                <!-- PASSWORD -->

                <div class="field-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Create a secure password"
                        required
                        aria-describedby="password-error"
                        aria-invalid="false"
                    >


                    <span
                        id="password-error"
                        class="field-error"
                        aria-live="polite"
                    ></span>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="field-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>


                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        autocomplete="new-password"
                        placeholder="Repeat your password"
                        required
                        aria-describedby="confirm-password-error"
                        aria-invalid="false"
                    >


                    <span
                        id="confirm-password-error"
                        class="field-error"
                        aria-live="polite"
                    ></span>

                </div>



                <!-- =================================================
                     SUBMIT BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="submit-button"
                >

                    <span>
                        Verify &amp; Continue
                    </span>


                    <span aria-hidden="true">
                        ↗
                    </span>

                </button>

            </form>



            <!-- =================================================
                 GLOBAL FORM STATUS
            ================================================== -->

            <div
                id="form-status"
                class="form-status"
                aria-live="polite"
                aria-atomic="true"
            ></div>

        </section>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="site-footer">

            <span>
                LUMEN / 01
            </span>


            <span>
                DATA INTEGRITY PROTOCOL
            </span>

        </footer>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
